#
# Continuous Integration workflow to compile and verify Unipad firmware targets
# using Raspberry Pi Pico SDK 2.x, Bluepad32, and the ARM Cortex-M GNU toolchain.

name: Build Firmware

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Enforce least-privilege GITHUB_TOKEN permissions.
permissions:
  contents: read

# Cancel superseded runs on feature branches / PR updates while letting main pushes complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  BUILD_TYPE: Release
  PICO_SDK_VERSION: "2.3.1"

jobs:
  build-firmware:
    name: ${{ matrix.target }} (${{ matrix.pico_board }} / ${{ matrix.mcu }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          # Primary production hardware: Raspberry Pi Pico 2 W (RP2350 + CYW43439)
          - target: unipad_c64
            pico_board: pico2_w
            mcu: RP2350
            uf2_family_id: "0xe48bff59"
          # Bring-up / fallback compatibility: Raspberry Pi Pico W (RP2040 + CYW43439)
          - target: unipad_c64
            pico_board: pico_w
            mcu: RP2040
            uf2_family_id: "0xe48bff56"

    steps:
      - name: Checkout Unipad repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout Raspberry Pi Pico SDK (${{ env.PICO_SDK_VERSION }})
        uses: actions/checkout@v4
        with:
          repository: raspberrypi/pico-sdk
          ref: ${{ env.PICO_SDK_VERSION }}
          path: pico-sdk

      # Initialize only top-level Pico SDK submodules (btstack, cyw43-driver, lwip,
      # mbedtls, tinyusb) without recursively pulling multi-gigabyte vendor MCU HALs.
      - name: Initialize Pico SDK submodules
        working-directory: ${{ github.workspace }}/pico-sdk
        run: git submodule update --init --depth 1

      - name: Cache prebuilt picotool host binary
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/picotool-cache
          key: picotool-${{ runner.os }}-${{ runner.arch }}-pico-sdk-${{ env.PICO_SDK_VERSION }}

      - name: Install ARM embedded toolchain & host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            gcc-arm-none-eabi \
            git \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib \
            libusb-1.0-0-dev \
            ninja-build \
            pkg-config \
            python3

      - name: Configure CMake (${{ matrix.target }} / ${{ matrix.pico_board }})
        env:
          TARGET_APP: ${{ matrix.target }}
          PICO_BOARD_NAME: ${{ matrix.pico_board }}
          PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
          PICOTOOL_FETCH_FROM_GIT_PATH: ${{ runner.temp }}/picotool-cache
        run: |
          mkdir -p "${PICOTOOL_FETCH_FROM_GIT_PATH}"
          cmake \
            -S "firmware/${TARGET_APP}" \
            -B "build/${TARGET_APP}-${PICO_BOARD_NAME}" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DPICO_BOARD="${PICO_BOARD_NAME}" \
            -DPICO_SDK_PATH="${PICO_SDK_PATH}" \
            -DUNIPAD_WARNINGS_AS_ERRORS=ON

      - name: Compile firmware
        env:
          TARGET_APP: ${{ matrix.target }}
          PICO_BOARD_NAME: ${{ matrix.pico_board }}
        run: |
          cmake --build "build/${TARGET_APP}-${PICO_BOARD_NAME}" --parallel

      - name: Verify UF2/ELF outputs & report memory footprint
        env:
          TARGET_APP: ${{ matrix.target }}
          PICO_BOARD_NAME: ${{ matrix.pico_board }}
          MCU_NAME: ${{ matrix.mcu }}
          EXPECTED_UF2_FAMILY: ${{ matrix.uf2_family_id }}
        run: |
          BUILD_DIR="build/${TARGET_APP}-${PICO_BOARD_NAME}"
          for ext in elf uf2 bin dis elf.map; do
            ARTIFACT="${BUILD_DIR}/${TARGET_APP}.${ext}"
            if [[ ! -s "${ARTIFACT}" ]]; then
              echo "::error::Expected non-empty build output '${ARTIFACT}' was not generated."
              exit 1
            fi
          done

          python3 - "${BUILD_DIR}/${TARGET_APP}.uf2" "${EXPECTED_UF2_FAMILY}" <<'PY'
          import os
          import struct
          import sys

          uf2_path = sys.argv[1]
          expected_family = int(sys.argv[2], 16)
          data = open(uf2_path, "rb").read()

          if len(data) == 0 or (len(data) % 512) != 0:
              raise SystemExit(f"Invalid UF2 size ({len(data)} bytes): must be a non-zero multiple of 512.")

          families_seen = set()
          num_blocks = len(data) // 512
          for idx in range(num_blocks):
              block = data[idx * 512 : (idx + 1) * 512]
              m0, m1, flags, target_addr, payload_size, block_no, total_blocks, family_id = struct.unpack("<8I", block[:32])
              m_end, = struct.unpack("<I", block[508:512])
              if m0 != 0x0A324655 or m1 != 0x9E5D5157 or m_end != 0x0AB16F30:
                  raise SystemExit(f"Corrupt UF2 magic word in block {idx}.")
              if flags & 0x00002000:
                  families_seen.add(family_id)

          if expected_family not in families_seen:
              seen_hex = ", ".join(f"{fam:#010x}" for fam in sorted(families_seen))
              raise SystemExit(
                  f"Expected UF2 family ID {expected_family:#010x} not found in {os.path.basename(uf2_path)} (saw: {seen_hex})."
              )

          print(f"Verified {os.path.basename(uf2_path)}: {num_blocks} UF2 blocks ({len(data):,} bytes), family {expected_family:#010x} OK.")
          PY

          UF2_BYTES=$(wc -c < "${BUILD_DIR}/${TARGET_APP}.uf2" | tr -d ' ')
          SIZE_OUT=$(arm-none-eabi-size "${BUILD_DIR}/${TARGET_APP}.elf")
          echo "${SIZE_OUT}"

          {
            echo "### Firmware Build Summary: \`${TARGET_APP}\` (\`${PICO_BOARD_NAME}\` / \`${MCU_NAME}\`)"
            echo ""
            echo "- **Pico SDK:** \`${PICO_SDK_VERSION}\`"
            echo "- **Build Type:** \`${BUILD_TYPE}\` (\`-DUNIPAD_WARNINGS_AS_ERRORS=ON\`)"
            echo "- **UF2 Image Size:** \`${UF2_BYTES}\` bytes"
            echo ""
            echo "\`\`\`text"
            echo "${SIZE_OUT}"
            echo "\`\`\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ matrix.pico_board }}-firmware
          retention-days: 14
          if-no-files-found: error
          path: |
            build/${{ matrix.target }}-${{ matrix.pico_board }}/${{ matrix.target }}.uf2
            build/${{ matrix.target }}-${{ matrix.pico_board }}/${{ matrix.target }}.elf
            build/${{ matrix.target }}-${{ matrix.pico_board }}/${{ matrix.target }}.elf.map
